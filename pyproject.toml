[project]
name = "pia-desarrollo-web"
version = "0.1.0"
description = "PIA de la materia desarrollo web tecnologias servidor"
authors = [
    {name = "Bryan31793",email = "bryanrmzlop@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.poetry]
package-mode = false